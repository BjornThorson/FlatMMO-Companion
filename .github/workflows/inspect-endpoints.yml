name: Inspect FlatMMO endpoints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect official endpoints
        run: python3 scripts/inspect_flatmmo_endpoints.py
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatmmo-endpoint-inventory
          path: endpoint-audit/endpoint_inventory_v1.json
          if-no-files-found: error
          retention-days: 30
